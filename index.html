<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Währungsrechner – Compact Currency Converter</title>
  
  <!-- PWA & Mobile Web App meta tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CCC">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/svg+xml" href="logo.svg">

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --focus-ring: #3b82f6;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      --badge-bg: #f1f5f9;
      --badge-text: #475569;
      --success-dot: #10b981;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card-bg: #1e293b;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: #334155;
        --focus-ring: #60a5fa;
        --primary: #3b82f6;
        --primary-light: #1e3a8a33;
        --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        --badge-bg: #334155;
        --badge-text: #cbd5e1;
        --success-dot: #34d399;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .converter-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 370px;
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border);
      position: relative;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      padding: 3px 8px;
      background: var(--badge-bg);
      color: var(--badge-text);
      border-radius: 9999px;
      font-weight: 500;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--success-dot);
    }

    .status-dot.loading {
      background-color: #f59e0b;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    .field {
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
      background: var(--card-bg);
    }

    .field:focus-within {
      border-color: var(--focus-ring);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .field-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }

    .field-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .input-row {
      display: flex;
      align-items: center;
    }

    .currency-input {
      border: none;
      outline: none;
      background: transparent;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text);
      width: 100%;
      min-width: 0;
    }

    .currency-input::placeholder {
      color: var(--text-muted);
      opacity: 0.4;
    }

    /* Minimalist Currency Dropdown */
    .currency-select-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      margin-left: 8px;
      flex-shrink: 0;
    }

    .currency-select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background: var(--badge-bg);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 7px 28px 7px 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      outline: none;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .currency-select:hover {
      border-color: var(--primary);
    }

    .currency-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }

    .currency-select option {
      background: var(--card-bg);
      color: var(--text);
      font-weight: 600;
    }

    .select-arrow {
      position: absolute;
      right: 9px;
      pointer-events: none;
      color: var(--text-muted);
      display: flex;
      align-items: center;
    }

    .swap-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: -4px 0;
      z-index: 2;
    }

    .swap-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.04);
    }

    .swap-btn:hover {
      color: var(--primary);
      border-color: var(--primary);
      transform: rotate(180deg);
    }

    .rate-card {
      margin-top: 18px;
      padding: 14px 16px;
      background: var(--badge-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rate-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .rate-title {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .refresh-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease, transform 0.3s ease;
    }

    .refresh-btn:hover {
      color: var(--primary);
    }

    .refresh-btn.spinning svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .rate-main {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .rate-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .quick-presets {
      display: flex;
      gap: 6px;
      margin-top: 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .quick-presets::-webkit-scrollbar {
      display: none;
    }

    .preset-btn {
      flex: 1;
      padding: 6px 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      text-align: center;
    }

    .preset-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="converter-card">
    <div class="header">
      <div class="title">
        <img src="logo.svg" alt="Logo" width="24" height="24" style="border-radius: 6px; display: block;">
        <span id="titleText">CZK ⇄ EUR</span>
      </div>
      <div class="status-badge" id="statusBadge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Lade Kurs...</span>
      </div>
    </div>

    <div class="input-group">
      <!-- Top Box -->
      <div class="field" id="boxTop">
        <div class="field-content">
          <label class="field-label" id="labelTop" for="inputTop">Tschechische Krone</label>
          <div class="input-row">
            <input type="text" inputmode="decimal" id="inputTop" class="currency-input" placeholder="0" autocomplete="off" spellcheck="false">
          </div>
        </div>
        <div class="currency-select-wrapper">
          <select id="selectTop" class="currency-select" aria-label="Währung oben">
            <option value="CZK" selected>CZK (Kč)</option>
            <option value="EUR">EUR (€)</option>
            <option value="USD">USD ($)</option>
            <option value="VND">VND (₫)</option>
            <option value="JPY">JPY (¥)</option>
            <option value="GBP">GBP (£)</option>
          </select>
          <span class="select-arrow">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </span>
        </div>
      </div>

      <!-- Swap Button -->
      <div class="swap-divider">
        <button class="swap-btn" id="swapBtn" title="Währungen tauschen" type="button" aria-label="Tauschen">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="3" x2="12" y2="21"></line>
            <polyline points="8 7 12 3 16 7"></polyline>
            <polyline points="8 17 12 21 16 17"></polyline>
          </svg>
        </button>
      </div>

      <!-- Bottom Box -->
      <div class="field" id="boxBottom">
        <div class="field-content">
          <label class="field-label" id="labelBottom" for="inputBottom">Euro</label>
          <div class="input-row">
            <input type="text" inputmode="decimal" id="inputBottom" class="currency-input" placeholder="0" autocomplete="off" spellcheck="false">
          </div>
        </div>
        <div class="currency-select-wrapper">
          <select id="selectBottom" class="currency-select" aria-label="Währung unten">
            <option value="CZK">CZK (Kč)</option>
            <option value="EUR" selected>EUR (€)</option>
            <option value="USD">USD ($)</option>
            <option value="VND">VND (₫)</option>
            <option value="JPY">JPY (¥)</option>
            <option value="GBP">GBP (£)</option>
          </select>
          <span class="select-arrow">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </span>
        </div>
      </div>
    </div>

    <!-- Quick Presets -->
    <div class="quick-presets" id="quickPresets"></div>

    <!-- Tageskurs Display -->
    <div class="rate-card">
      <div class="rate-header">
        <span class="rate-title">Aktueller Tageskurs</span>
        <button class="refresh-btn" id="refreshBtn" title="Kurs aktualisieren">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
            <path d="M16 21h5v-5"/>
          </svg>
        </button>
      </div>
      <div class="rate-main" id="rateMainText">100 CZK = -- EUR</div>
      <div class="rate-sub">
        <span id="rateInverseText">1 EUR = -- CZK</span>
        <span id="rateDateText">Stand: --</span>
      </div>
    </div>
  </div>

  <script>
    // Supported Currencies Metadata
    const CURRENCIES = {
      CZK: { name: 'Tschechische Krone', symbol: 'Kč', presets: [100, 500, 1000, 2000, 5000], defaultVal: 1000, factor: 100, decimals: 2 },
      EUR: { name: 'Euro', symbol: '€', presets: [10, 25, 50, 100, 200], defaultVal: 50, factor: 1, decimals: 2 },
      USD: { name: 'US-Dollar', symbol: '$', presets: [10, 25, 50, 100, 200], defaultVal: 50, factor: 1, decimals: 2 },
      VND: { name: 'Vietnamesischer Dong', symbol: '₫', presets: [50000, 100000, 200000, 500000, 1000000], defaultVal: 500000, factor: 100000, decimals: 0 },
      JPY: { name: 'Japanischer Yen', symbol: '¥', presets: [1000, 3000, 5000, 10000, 20000], defaultVal: 5000, factor: 1000, decimals: 0 },
      GBP: { name: 'Britisches Pfund', symbol: '£', presets: [10, 25, 50, 100, 200], defaultVal: 50, factor: 1, decimals: 2 }
    };

    // State (rates relative to EUR: 1 EUR = rates[X] X)
    let rates = {
      EUR: 1,
      CZK: 24.35,
      USD: 1.15,
      VND: 29850,
      JPY: 180.25,
      GBP: 0.858
    };

    let lastActiveField = 'top'; // 'top' or 'bottom'
    let currentTop = 'CZK';
    let currentBottom = 'EUR';
    let lastFetchedDate = '';
    let lastFetchedSource = '';

    const inputTop = document.getElementById('inputTop');
    const inputBottom = document.getElementById('inputBottom');
    const selectTop = document.getElementById('selectTop');
    const selectBottom = document.getElementById('selectBottom');
    const labelTop = document.getElementById('labelTop');
    const labelBottom = document.getElementById('labelBottom');
    const swapBtn = document.getElementById('swapBtn');
    const rateMainText = document.getElementById('rateMainText');
    const rateInverseText = document.getElementById('rateInverseText');
    const rateDateText = document.getElementById('rateDateText');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const refreshBtn = document.getElementById('refreshBtn');
    const titleText = document.getElementById('titleText');
    const quickPresets = document.getElementById('quickPresets');

    // German number formatter
    function formatNumber(num, maxDecimals = 2) {
      if (isNaN(num) || num === null) return '';
      return new Intl.NumberFormat('de-DE', {
        minimumFractionDigits: 0,
        maximumFractionDigits: maxDecimals
      }).format(num);
    }

    function parseInput(val) {
      if (!val) return null;
      const cleaned = val.toString().trim().replace(/\s/g, '').replace(/,/g, '.');
      const num = parseFloat(cleaned);
      return isNaN(num) ? null : num;
    }

    // Get exchange rate: 1 unit of fromCurr = ? units of toCurr
    function getRate(fromCurr, toCurr) {
      if (fromCurr === toCurr) return 1;
      const rateFrom = rates[fromCurr];
      const rateTo = rates[toCurr];
      if (!rateFrom || !rateTo) return 1;
      return rateTo / rateFrom;
    }

    function calculate(source = lastActiveField) {
      lastActiveField = source;
      const rateTopToBottom = getRate(currentTop, currentBottom);
      const decBottom = CURRENCIES[currentBottom].decimals;
      const decTop = CURRENCIES[currentTop].decimals;

      if (source === 'top') {
        const valTop = parseInput(inputTop.value);
        if (valTop === null) {
          inputBottom.value = '';
        } else {
          const res = valTop * rateTopToBottom;
          inputBottom.value = formatNumber(res, decBottom);
        }
      } else {
        const valBottom = parseInput(inputBottom.value);
        if (valBottom === null) {
          inputTop.value = '';
        } else {
          const res = valBottom / rateTopToBottom;
          inputTop.value = formatNumber(res, decTop);
        }
      }
    }

    function updateLabelsAndTitle() {
      labelTop.textContent = CURRENCIES[currentTop].name;
      labelBottom.textContent = CURRENCIES[currentBottom].name;
      titleText.textContent = `${currentTop} ⇄ ${currentBottom}`;
    }

    function updateRateDisplay() {
      const rateTopToBottom = getRate(currentTop, currentBottom);
      const rateBottomToTop = getRate(currentBottom, currentTop);

      const factorTop = CURRENCIES[currentTop].factor || 1;
      const factorBottom = CURRENCIES[currentBottom].factor || 1;

      // Primary display
      if (factorTop > 1) {
        const primaryConverted = factorTop * rateTopToBottom;
        rateMainText.textContent = `${formatNumber(factorTop)} ${currentTop} = ${formatNumber(primaryConverted, 2)} ${currentBottom}`;
      } else {
        rateMainText.textContent = `1 ${currentTop} = ${formatNumber(rateTopToBottom, rateTopToBottom < 1 ? 4 : 3)} ${currentBottom}`;
      }

      // Inverse display
      if (factorBottom > 1) {
        const secondaryConverted = factorBottom * rateBottomToTop;
        rateInverseText.textContent = `${formatNumber(factorBottom)} ${currentBottom} = ${formatNumber(secondaryConverted, 2)} ${currentTop}`;
      } else {
        rateInverseText.textContent = `1 ${currentBottom} = ${formatNumber(rateBottomToTop, rateBottomToTop < 1 ? 4 : 3)} ${currentTop}`;
      }

      if (lastFetchedDate) {
        let displayDate = lastFetchedDate;
        if (/^\d{4}-\d{2}-\d{2}$/.test(lastFetchedDate)) {
          const [y, m, d] = lastFetchedDate.split('-');
          displayDate = `${d}.${m}.${y}`;
        }
        rateDateText.textContent = `Stand: ${displayDate}`;
      }
    }

    function updatePresets() {
      quickPresets.innerHTML = '';
      const config = CURRENCIES[currentTop];
      config.presets.forEach(val => {
        const btn = document.createElement('button');
        btn.className = 'preset-btn';
        btn.textContent = `${formatNumber(val)} ${config.symbol}`;
        btn.addEventListener('click', () => {
          inputTop.value = formatNumber(val);
          calculate('top');
          inputTop.focus();
        });
        quickPresets.appendChild(btn);
      });
    }

    function onCurrenciesChanged() {
      updateLabelsAndTitle();
      updateRateDisplay();
      updatePresets();
      calculate(lastActiveField);
    }

    // Dropdown change handlers
    selectTop.addEventListener('change', (e) => {
      const newTop = e.target.value;
      if (newTop === currentBottom) {
        // Swap currencies if user selects same in both
        selectBottom.value = currentTop;
        currentBottom = currentTop;
      }
      currentTop = newTop;
      onCurrenciesChanged();
    });

    selectBottom.addEventListener('change', (e) => {
      const newBottom = e.target.value;
      if (newBottom === currentTop) {
        // Swap currencies if user selects same in both
        selectTop.value = currentBottom;
        currentTop = currentBottom;
      }
      currentBottom = newBottom;
      onCurrenciesChanged();
    });

    // Swap button click handler
    swapBtn.addEventListener('click', () => {
      const tempCurr = currentTop;
      currentTop = currentBottom;
      currentBottom = tempCurr;

      selectTop.value = currentTop;
      selectBottom.value = currentBottom;

      const tempVal = inputTop.value;
      inputTop.value = inputBottom.value;
      inputBottom.value = tempVal;

      lastActiveField = 'top';
      onCurrenciesChanged();
      inputTop.focus();
    });

    // Input event listeners
    inputTop.addEventListener('input', () => calculate('top'));
    inputBottom.addEventListener('input', () => calculate('bottom'));
    inputTop.addEventListener('focus', () => inputTop.select());
    inputBottom.addEventListener('focus', () => inputBottom.select());

    // Fetch exchange rates
    async function fetchRates() {
      statusDot.className = 'status-dot loading';
      statusText.textContent = 'Aktualisiere...';
      refreshBtn.classList.add('spinning');

      let fetched = false;

      // 1. Try open.er-api.com (Supports all currencies: CZK, USD, VND, JPY, GBP, EUR)
      try {
        const resp = await fetch('https://open.er-api.com/v6/latest/EUR');
        if (resp.ok) {
          const data = await resp.json();
          if (data && data.rates) {
            Object.keys(CURRENCIES).forEach(c => {
              if (data.rates[c]) rates[c] = data.rates[c];
            });
            lastFetchedDate = data.time_last_update_utc ? new Date(data.time_last_update_utc).toISOString().split('T')[0] : 'heute';
            lastFetchedSource = 'Live';
            fetched = true;
          }
        }
      } catch (e) {
        console.warn('Primary open.er-api failed, trying fallbacks...');
      }

      // 2. Fallback to jsdelivr currency API
      if (!fetched) {
        try {
          const resp = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/eur.json');
          if (resp.ok) {
            const data = await resp.json();
            if (data && data.eur) {
              Object.keys(CURRENCIES).forEach(c => {
                const low = c.toLowerCase();
                if (data.eur[low]) rates[c] = data.eur[low];
              });
              lastFetchedDate = data.date || 'heute';
              lastFetchedSource = 'Fallback';
              fetched = true;
            }
          }
        } catch (e) {
          console.warn('Fallback jsdelivr failed...');
        }
      }

      // 3. Fallback to localStorage cache
      if (!fetched) {
        const cached = localStorage.getItem('ccc_rates_cache_v2');
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            rates = Object.assign(rates, parsed.rates);
            lastFetchedDate = parsed.date + ' (offline)';
            lastFetchedSource = 'Cache';
            fetched = true;
          } catch (e) {}
        }
      }

      if (fetched) {
        localStorage.setItem('ccc_rates_cache_v2', JSON.stringify({
          rates: rates,
          date: lastFetchedDate
        }));
        statusDot.className = 'status-dot';
        statusText.textContent = lastFetchedSource;
      } else {
        statusDot.className = 'status-dot loading';
        statusText.textContent = 'Offline';
        if (!lastFetchedDate) lastFetchedDate = 'Notfallkurs (offline)';
      }

      updateRateDisplay();
      calculate(lastActiveField);
      refreshBtn.classList.remove('spinning');
    }

    refreshBtn.addEventListener('click', fetchRates);

    // Initial setup
    inputTop.value = formatNumber(CURRENCIES[currentTop].defaultVal);
    updateLabelsAndTitle();
    updatePresets();
    fetchRates();

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          reg.update();
        }).catch(err => {
          console.warn('SW registration failed:', err);
        });
      });
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
    }
  </script>
</body>
</html>
